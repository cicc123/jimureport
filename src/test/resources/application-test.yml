# Test Profile - 使用 H2 内存数据库
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 跳过 SQL 初始化（H2 兼容问题）
  sql:
    init:
      mode: never

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.jimureport.enhancement.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 测试环境禁用逻辑删除
      logic-delete-field:
      logic-delete-value: 2
      logic-not-delete-value: 0

# Sa-Token
sa-token:
  token-name: X-Access-Token
  timeout: 3600
  is-concurrent: true
  token-style: uuid
  is-log: false

# 积木报表（禁用自动配置）
jimureport:
  enabled: false

# SpringDoc（禁用）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Logging
logging:
  level:
    com.jimureport.enhancement: DEBUG
